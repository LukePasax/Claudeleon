# La release di Claudeleon: le prove su Linux, poi l'installer per Windows, pubblicato come release di GitHub con
# latest.yml (da lì l'app installata si aggiorna da sola, vedi src/release-updater.js).
#
# Si lancia da GitHub: Actions → "Release" → "Run workflow" (prende la versione da claude-skins/app/package.json e
# crea il tag v<versione>), oppure spingendo un tag v<versione> uguale a quella del package.json. Per una release
# nuova, prima si alza la versione nel package.json (npm version patch|minor|major --no-git-tag-version).
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-skins/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: claude-skins/app/package-lock.json
      - name: Dipendenze
        run: npm ci
      - name: Prove della logica
        run: npm test

  windows:
    needs: prove
    runs-on: windows-latest
    defaults:
      run:
        working-directory: claude-skins/app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: claude-skins/app/package-lock.json
      - name: Versione
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Il tag $GITHUB_REF_NAME non corrisponde alla versione del package.json ($VERSION)"
            exit 1
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error::La release v$VERSION c'è già: alza la versione in claude-skins/app/package.json"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - name: Installer
        run: npx electron-builder --win nsis --publish never
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Claudeleon ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            claude-skins/app/dist/Claudeleon-Setup-*.exe
            claude-skins/app/dist/Claudeleon-Setup-*.exe.blockmap
            claude-skins/app/dist/latest.yml
